name: Weekly

on:
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # The build-logic property takes any Gradle version selector; "+" is the
  # newest Kotlin published, pre-releases included. The locks and the
  # verification metadata name the pinned Kotlin, so this run rewrites the one
  # and only warns about the other.
  next-kotlin:
    name: tests on the next Kotlin
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - run: ./gradlew test -Pitinera.next-kotlin=+ --write-locks --dependency-verification lenient

  # JDK 27 is the newest release; it moves on every March and September.
  newest-jdk:
    name: tests on the newest JDK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - run: ./gradlew test -Pitinera.test-jdk=27
